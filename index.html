<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRA DOCUMENT CHECKER</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f7f9;
  color: #222;
}

.header {
  background: #fff;
  border-bottom: 1px solid #ddd;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.header img {
  width: 52px;
  height: 52px;
  object-fit: contain;
  flex-shrink: 0;
}

.header-title {
  flex: 1;
}

.header h1 {
  margin: 0;
  font-size: 21px;
  color: #17365d;
}

.header p {
  margin: 4px 0 0;
  color: #666;
  font-size: 13px;
}

.close-btn {
  border: 0;
  background: transparent;
  font-size: 30px;
  color: #777;
  cursor: pointer;
  line-height: 1;
}

.container {
  max-width: 720px;
  margin: 28px auto;
  padding: 0 16px;
}

.verification-card {
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
  overflow: hidden;
}

.status-banner {
  padding: 22px 20px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

.status-banner.valid {
  background: #168a45;
  color: #fff;
}

.status-banner.invalid {
  background: #b42318;
  color: #fff;
}

.status-banner.loading {
  background: #667085;
  color: #fff;
}

.check,
.invalid-icon {
  display: inline-flex;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #fff;
  align-items: center;
  justify-content: center;
  margin-right: 8px;
  font-size: 22px;
}

.check {
  color: #168a45;
}

.invalid-icon {
  color: #b42318;
}

.details {
  padding: 8px 20px 20px;
}

.row {
  display: flex;
  border-bottom: 1px solid #e5e5e5;
  padding: 15px 5px;
  gap: 20px;
}

.label {
  width: 38%;
  font-weight: bold;
  color: #555;
}

.value {
  width: 62%;
  color: #222;
  word-break: break-word;
}

.message {
  text-align: center;
  padding: 28px 20px;
  color: #555;
}

.reference {
  text-align: center;
  color: #555;
  font-size: 13px;
  margin-top: 18px;
}

.footer {
  text-align: center;
  padding: 22px 15px;
  color: #777;
  font-size: 13px;
}

@media (max-width: 600px) {
  .container {
    margin: 20px auto;
  }

  .header h1 {
    font-size: 18px;
  }

  .header img {
    width: 46px;
    height: 46px;
  }

  .row {
    display: block;
  }

  .label,
  .value {
    width: 100%;
  }

  .value {
    margin-top: 5px;
  }

  .status-banner {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<header class="header">

  <img src="logo.png" alt="GRA">

  <div class="header-title">
    <h1>GRA DOCUMENT CHECKER</h1>
    <p>Document Verification</p>
  </div>

  <button
    class="close-btn"
    type="button"
    onclick="history.back()"
    aria-label="Close"
  >×</button>

</header>

<main class="container">

  <div class="verification-card">

    <div id="statusBanner" class="status-banner loading">
      CHECKING DOCUMENT...
    </div>

    <div id="content">
      <div class="message">
        Please wait while we verify the document.
      </div>
    </div>

  </div>

  <div class="reference">
    This document was verified through the GRA Document Checker.
  </div>

  <div class="footer">
    © 2026 GRA DOCUMENT CHECKER
  </div>

</main>

<script>

/* =========================================
   SUPABASE CONNECTION
   ========================================= */

const SUPABASE_URL =
  'https://zziwqanfrdttlcdolsnd.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_oYBv99K9xe1KLMBPsjn8uQ_gWNo8iHK';


/* =========================================
   GET DOCUMENT ID FROM QR CODE URL
   ========================================= */

const params = new URLSearchParams(
  window.location.search
);

const documentId =
  (
    params.get('id') ||
    params.get('document_id') ||
    ''
  ).trim();


const banner =
  document.getElementById('statusBanner');

const content =
  document.getElementById('content');


/* =========================================
   SECURITY
   ========================================= */

function escapeHtml(value) {

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


/* =========================================
   FORMAT DATE
   ========================================= */

function formatDate(value) {

  if (!value) return '-';

  const parts = value.split('-');

  if (parts.length !== 3) {
    return value;
  }

  const date = new Date(
    Number(parts[0]),
    Number(parts[1]) - 1,
    Number(parts[2])
  );

  return date.toLocaleDateString('en-US', {
    year: 'numeric',
    month: 'long',
    day: 'numeric'
  });

}


/* =========================================
   INVALID DOCUMENT
   ========================================= */

function renderInvalid(message) {

  banner.className =
    'status-banner invalid';

  banner.innerHTML =
    '<span class="invalid-icon">!</span>' +
    'INVALID DOCUMENT';

  content.innerHTML =
    `<div class="message">
      ${escapeHtml(message)}
    </div>`;

}


/* =========================================
   DISPLAY DOCUMENT
   ========================================= */

function renderDocument(doc) {

  const today =
    new Date().toISOString().slice(0, 10);

  const expired =
    doc.valid_until &&
    doc.valid_until < today;

  const storedValid =
    String(doc.status || '').toUpperCase()
    === 'VALID DOCUMENT';

  const valid =
    storedValid && !expired;


  if (valid) {

    banner.className =
      'status-banner valid';

    banner.innerHTML =
      '<span class="check">✓</span>' +
      'VALID DOCUMENT';

  } else {

    banner.className =
      'status-banner invalid';

    banner.innerHTML =
      '<span class="invalid-icon">!</span>' +
      (
        expired
          ? 'EXPIRED DOCUMENT'
          : 'INVALID DOCUMENT'
      );

  }


  const displayStatus =
    valid
      ? 'VALID DOCUMENT'
      : expired
        ? 'EXPIRED DOCUMENT'
        : (
            doc.status ||
            'INVALID DOCUMENT'
          );


  content.innerHTML = `

    <div class="details">

      <div class="row">
        <div class="label">Status</div>
        <div class="value">
          ${escapeHtml(displayStatus)}
        </div>
      </div>

      <div class="row">
        <div class="label">Document Type</div>
        <div class="value">
          ${escapeHtml(doc.document_type)}
        </div>
      </div>

      <div class="row">
        <div class="label">Document ID</div>
        <div class="value">
          ${escapeHtml(doc.document_id)}
        </div>
      </div>

      <div class="row">
        <div class="label">Issued On</div>
        <div class="value">
          ${escapeHtml(formatDate(doc.issued_on))}
        </div>
      </div>

      <div class="row">
        <div class="label">Issued To</div>
        <div class="value">
          ${escapeHtml(doc.issued_to)}
        </div>
      </div>

      <div class="row">
        <div class="label">TIN</div>
        <div class="value">
          ${escapeHtml(doc.tin)}
        </div>
      </div>

      <div class="row">
        <div class="label">Purpose</div>
        <div class="value">
          ${escapeHtml(doc.purpose)}
        </div>
      </div>

      <div class="row">
        <div class="label">Valid Until</div>
        <div class="value">
          ${escapeHtml(formatDate(doc.valid_until))}
        </div>
      </div>

      <div class="row">
        <div class="label">Tax Office</div>
        <div class="value">
          ${escapeHtml(doc.tax_office)}
        </div>
      </div>

    </div>

  `;

}


/* =========================================
   VERIFY DOCUMENT WITH SUPABASE
   ========================================= */

async function verifyDocument() {

  if (!documentId) {

    renderInvalid(
      'No Document ID was supplied. ' +
      'Please scan the QR code on the document.'
    );

    return;
  }


  try {

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/verify_document`,
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization':
            `Bearer ${SUPABASE_KEY}`
        },

        body: JSON.stringify({
          p_document_id: documentId
        })
      }
    );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(errorText);

      renderInvalid(
        'We could not complete the verification. ' +
        'Please try again.'
      );

      return;
    }


    const data =
      await response.json();

    const doc =
      Array.isArray(data)
        ? data[0]
        : data;


    if (!doc) {

      renderInvalid(
        'No document with this Document ID ' +
        'was found in the verification system.'
      );

      return;
    }


    renderDocument(doc);

  }

  catch (error) {

    console.error(error);

    renderInvalid(
      'Unable to connect to the verification service. ' +
      'Please try again.'
    );

  }

}


/* =========================================
   START VERIFICATION
   ========================================= */

verifyDocument();

</script>

</body>
</html>
